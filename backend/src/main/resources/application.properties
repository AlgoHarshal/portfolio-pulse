spring.application.name=portfolio-pulse

spring.datasource.url=jdbc:postgresql://localhost:5460/portfolio-pulse?timezone=Asia/Kolkata
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.show-sql=true

# Load local .env file natively (treated as properties)
spring.config.import=optional:file:.env[.properties]

# JWT Settings (defaults to local-dev if JWT_SECRET env var is unset)
jwt.secret=${JWT_SECRET:local_dev_secret_key_which_must_be_at_least_256_bits_for_hmac_sha256!}

# Alpha Vantage API Settings
alpha-vantage.api-key=${ALPHA_VANTAGE_API_KEY:demo}
alpha-vantage.base-url=https://www.alphavantage.co/query

# Resilience4j Rate Limiter Configuration (5 calls per 60 seconds, 0s timeout)
resilience4j.ratelimiter.instances.alphaVantage.limit-for-period=5
resilience4j.ratelimiter.instances.alphaVantage.limit-refresh-period=60s
resilience4j.ratelimiter.instances.alphaVantage.timeout-duration=0s
resilience4j.ratelimiter.instances.alphaVantage.register-health-indicator=true